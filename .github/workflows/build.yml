name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macOS-Intel
          - platform: ubuntu-22.04
            args: ''
            label: Linux
          - platform: windows-latest
            args: ''
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Workaround: GitHub's new token format (2026-08) corrupts the cargo config
      # that dtolnay/rust-toolchain writes, breaking later cargo invocations
      # with "Unexpected character at row 2, col 24". Remove it so cargo
      # regenerates a clean one on the next build step.
      # 2026-10-03 收编进模板：此前这个 workaround 只存在于 9 个产品仓的
      # build.yml 里，模板没有 ⇒ sync --apply 会把它当"待同步"删掉，
      # 等于一次分发打断全部 CI 构建。
      - name: Reset broken cargo config
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml" "$USERPROFILE/.cargo/config.toml"

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      # 不钉 registry：走 npm 默认源。
      # 2026-10-03 移除硬编码的 `--registry=https://registry.npmmirror.com` ——
      # 那是本机调试用的地域镜像，经模板分发后固化进 15 个 public 仓的
      # GitHub Actions（runner 多在美国/欧洲），既拖慢又构成单点供应链依赖。
      # 需要换源请走仓库级 .npmrc，不要写进模板。
      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
