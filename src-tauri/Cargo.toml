[package]
name = "z-biz-tool-aigen"
version = "0.2.0"
description = "AI内容制造工厂"
edition = "2021"

[lib]
name = "z_biz_tool_aigen_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：历史抽屉要读 results/ 下已落盘的产物（03 §6 结果引用）
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# 显式 rustls：跨平台不依赖系统 OpenSSL（06 R3/H3）；已移除未使用的 multipart（T-D3）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
chacha20poly1305 = "0.10"
base64 = "0.22"
# 能力层：魔数嗅探 / data URL 编解码 / MIME 映射（纯逻辑，信任边界仍在本仓）
cap-img = "0.2.0"
# 真 .pptx 产物：OOXML 就是 zip 包（T-B3）
zip = { version = "2", default-features = false, features = ["deflate"] }
# B5：历史时间戳改可读 ISO8601（05 T-C1 许可的依赖）
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
tempfile = "3"
quick-xml = "0.42.0"
